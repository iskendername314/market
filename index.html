<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market">
<title>Market Siyahısı</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111;--s1:#1a1a1a;--s2:#222;
  --border:#2e2e2e;--accent:#f5a623;--green:#3dba78;--red:#e05535;
  --txt:#f0f0f0;--txt2:#888;--txt3:#444;--r:13px;
  --sbot:env(safe-area-inset-bottom,0px);
  --stop:env(safe-area-inset-top,0px);
}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{color:var(--txt);font-family:'DM Sans',sans-serif;max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100vh}

/* TOPBAR */
.top{
  position:sticky;top:0;z-index:50;
  background:rgba(17,17,17,.95);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--border);
  padding:calc(12px + var(--stop)) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{font-size:1.1rem;font-weight:700;color:var(--accent);display:flex;align-items:center;gap:6px}
.mode-sw{display:flex;background:var(--s2);border:1px solid var(--border);border-radius:99px;padding:3px;gap:2px}
.msw{border:none;background:none;font-family:'DM Sans',sans-serif;font-size:.75rem;font-weight:600;color:var(--txt2);padding:5px 13px;border-radius:99px;cursor:pointer;transition:all .2s}
.msw.on{background:var(--accent);color:#111}

/* PROGRESS (shop mode) */
.prog{padding:10px 16px 0;display:none}
.prog.show{display:block}
.prog-top{display:flex;justify-content:space-between;margin-bottom:5px;font-size:.72rem;color:var(--txt2)}
.prog-top b{color:var(--accent)}
.prog-track{height:4px;background:var(--s2);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--red));border-radius:99px;transition:width .4s ease;width:0%}

/* MAIN */
.main{flex:1;overflow-y:auto;padding:12px 16px 100px;-webkit-overflow-scrolling:touch}

/* SECTION LABEL */
.slabel{font-size:.67rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);display:flex;align-items:center;gap:8px;margin:16px 0 7px 2px}
.slabel::after{content:'';flex:1;height:1px;background:var(--border)}

/* ITEM */
.item{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:var(--r);border:1.5px solid transparent;margin-bottom:5px;transition:background .15s,opacity .2s;user-select:none;animation:pop .18s ease both}
@keyframes pop{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.item.tap{cursor:pointer}
.item.tap:active{background:var(--s2)}
.item.done{opacity:.38}
.cb{width:22px;height:22px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:.72rem;color:#111;transition:all .2s}
.item.done .cb{background:var(--green);border-color:var(--green)}
.ico{font-size:1rem;width:22px;text-align:center;flex-shrink:0;color:var(--txt2)}
.ibody{flex:1;min-width:0}
.iname{font-size:.93rem;font-weight:500;transition:color .2s}
.item.done .iname{color:var(--txt3);text-decoration:line-through;text-decoration-color:var(--txt3)}
.imeta{font-size:.73rem;color:var(--txt2);margin-top:1px}
.iqty{font-size:.73rem;color:var(--accent);font-weight:600;flex-shrink:0;background:var(--s2);border:1px solid var(--border);padding:2px 8px;border-radius:6px}
.ibtns{display:flex;gap:3px;flex-shrink:0}
.ib{background:none;border:none;font-size:.9rem;cursor:pointer;padding:5px 6px;border-radius:7px;color:var(--txt3);transition:all .15s}
.ib:hover{color:var(--red);background:rgba(224,85,53,.1)}
.ib.e:hover{color:var(--accent);background:rgba(245,166,35,.1)}

/* EMPTY */
.empty{text-align:center;padding:48px 0;color:var(--txt2);font-size:.88rem}
.empty div{font-size:2.5rem;margin-bottom:10px}

/* CELEBRATE */
.cel{text-align:center;padding:20px 0;font-weight:600;color:var(--green);font-size:.95rem;display:none;animation:pop .4s ease}
.cel.show{display:block}

/* FAB */
.fab{position:fixed;bottom:calc(70px + var(--sbot));right:18px;width:50px;height:50px;background:linear-gradient(135deg,var(--accent),var(--red));border-radius:50%;border:none;font-size:1.4rem;color:#111;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(245,166,35,.4);transition:transform .15s;z-index:100}
.fab:active{transform:scale(.93)}
.fab.hide{display:none}

/* BOTTOM BAR */
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(17,17,17,.97);backdrop-filter:blur(14px);border-top:1px solid var(--border);padding:9px 16px calc(9px + var(--sbot));z-index:90}
.bbar-row{display:flex;gap:8px}
.bbt{flex:1;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:9px 6px;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:600;color:var(--txt2);cursor:pointer;transition:all .18s;text-align:center}
.bbt:hover{border-color:var(--accent);color:var(--accent)}
.bbt.d:hover{border-color:var(--red);color:var(--red)}

/* OVERLAY */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;opacity:0;pointer-events:none;transition:opacity .22s}
.ov.show{opacity:1;pointer-events:all}

/* SHEET */
.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:480px;z-index:300;background:var(--s1);border-top:1.5px solid var(--border);border-radius:20px 20px 0 0;padding:14px 18px calc(24px + var(--sbot));transition:transform .28s cubic-bezier(.4,0,.2,1);max-height:90vh;overflow-y:auto}
.sheet.show{transform:translateX(-50%) translateY(0)}
.handle{width:34px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 14px}
.stitle{font-size:1rem;font-weight:700;color:var(--accent);margin-bottom:14px}
.fl{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt2);margin:12px 0 5px}
.fl:first-of-type{margin-top:0}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:.9rem;color:var(--txt);outline:none;transition:border-color .18s}
.inp::placeholder{color:var(--txt3)}
.inp:focus{border-color:var(--accent)}
.irow{display:flex;gap:8px}
.irow .inp{flex:1}
.sel{width:100%;background:var(--s2);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-family:'DM Sans',sans-serif;font-size:.86rem;color:var(--txt);outline:none;cursor:pointer;-webkit-appearance:none}
.sel:focus{border-color:var(--accent)}
.sel option{background:#1a1a1a}

.brow{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:none;border-radius:10px;padding:11px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:600;cursor:pointer;transition:opacity .18s}
.btn:active{opacity:.8}
.btnp{background:linear-gradient(135deg,var(--accent),var(--red));color:#111}
.btng{background:var(--s2);border:1.5px solid var(--border);color:var(--txt2)}
</style>
</head>
<body>

<div class="top">
  <div class="logo">🛒 Market</div>
  <div class="mode-sw">
    <button class="msw on" id="mPlan" onclick="setMode('plan')">📋 Siyahı</button>
    <button class="msw"    id="mShop" onclick="setMode('shop')">🏪 Market</button>
  </div>
</div>

<div class="prog" id="prog">
  <div class="prog-top"><span>İrəliləyiş</span><span><b id="dn">0</b> / <span id="tn">0</span></span></div>
  <div class="prog-track"><div class="prog-fill" id="pf"></div></div>
</div>

<div class="main">
  <div id="list"></div>
  <div class="cel" id="cel">🎉 Hamısı alındı!</div>
</div>

<button class="fab" id="fab" onclick="openSheet()">+</button>

<div class="bbar"><div class="bbar-row" id="brow"></div></div>

<div id="sv" style="position:fixed;bottom:110px;left:50%;transform:translateX(-50%);background:#222;border:1px solid #3dba78;color:#3dba78;font-size:.78rem;font-weight:600;padding:7px 16px;border-radius:99px;opacity:0;transition:opacity .3s;z-index:999;pointer-events:none">✓ Yadda saxlandı</div>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="stitle" id="stitle">Yeni məhsul</div>
  <div class="fl">Ad *</div>
  <input class="inp" id="fN" placeholder="məs. Süd, Çörək, Yumurta..." maxlength="50" onkeydown="if(event.key==='Enter')save()">
  <div class="fl">Miqdar</div>
  <div class="irow">
    <input class="inp" id="fQ" placeholder="1 kq, 3 ədəd..." maxlength="20" onkeydown="if(event.key==='Enter')save()">
    <input class="inp" id="fX" placeholder="Qeyd" maxlength="40" onkeydown="if(event.key==='Enter')save()">
  </div>
  <div class="fl">Kateqoriya</div>
  <select class="sel" id="fC">
    <option value="Tərəvəz & Meyvə">🥬 Tərəvəz & Meyvə</option>
    <option value="Ət & Balıq">🥩 Ət & Balıq</option>
    <option value="Süd məhsulları">🥛 Süd məhsulları</option>
    <option value="Çörək & Unlu">🍞 Çörək & Unlu</option>
    <option value="Ərzaq">🌾 Ərzaq</option>
    <option value="İçki">🧃 İçki</option>
    <option value="Ev & Təmizlik">🧹 Ev & Təmizlik</option>
    <option value="Şəxsi qulluq">🧴 Şəxsi qulluq</option>
    <option value="Digər">📦 Digər</option>
  </select>

  <div class="brow">
    <button class="btn btng" onclick="closeSheet()">Ləğv et</button>
    <button class="btn btnp" id="sbtn" onclick="save()">Əlavə et</button>
  </div>
</div>

<script>
const KEY = 'mkt1';
const CI  = {'Tərəvəz & Meyvə':'🥬','Ət & Balıq':'🥩','Süd məhsulları':'🥛','Çörək & Unlu':'🍞','Ərzaq':'🌾','İçki':'🧃','Ev & Təmizlik':'🧹','Şəxsi qulluq':'🧴','Digər':'📦'};

let items=[], nid=1, mode='plan', eid=null;

function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){items=d.items;nid=d.nid;mode=d.mode||'plan';}}catch(e){}
  if(!items.length) items=[
    {id:nid++,name:'Bulgur',       cat:'Ərzaq',           qty:'500q', note:'',done:false},
    {id:nid++,name:'Toyuq filesi', cat:'Ət & Balıq',      qty:'1 kq', note:'',done:false},
    {id:nid++,name:'Çöp poşeti',   cat:'Ev & Təmizlik',   qty:'',     note:'',done:false},
    {id:nid++,name:'Koloniya',     cat:'Şəxsi qulluq',    qty:'',     note:'',done:false},
    {id:nid++,name:'Bibər',        cat:'Tərəvəz & Meyvə', qty:'3 ədəd',note:'',done:false},
    {id:nid++,name:'Pomidor',      cat:'Tərəvəz & Meyvə', qty:'1 kq', note:'',done:false},
    {id:nid++,name:'Süfrə duzu',   cat:'Ərzaq',           qty:'',     note:'',done:false},
  ];
}
function persist(){
  try{localStorage.setItem(KEY,JSON.stringify({items,nid,mode}));}catch(e){}
  const t=document.getElementById('sv');
  t.style.opacity='1';
  clearTimeout(window._st);
  window._st=setTimeout(()=>t.style.opacity='0',1800);
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function setMode(m){
  mode=m;
  document.getElementById('mPlan').classList.toggle('on',m==='plan');
  document.getElementById('mShop').classList.toggle('on',m==='shop');
  document.getElementById('fab').classList.toggle('hide',m==='shop');
  document.getElementById('prog').classList.toggle('show',m==='shop');
  persist(); render();
}

function render(){
  // bottom bar
  document.getElementById('brow').innerHTML = mode==='plan'
    ? `<button class="bbt d" onclick="clearAll()">🗑️ Siyahını sil</button>`
    : `<button class="bbt" onclick="resetDone()">🔄 Sıfırla</button><button class="bbt d" onclick="clearDone()">✅ Alınanları sil</button>`;

  const el = document.getElementById('list');
  if(!items.length){el.innerHTML='<div class="empty"><div>🧺</div>Siyahı boşdur</div>';document.getElementById('cel').classList.remove('show');return;}

  let h='';
  if(mode==='plan'){
    const cats=[...new Set(items.map(i=>i.cat))];
    cats.forEach(c=>{
      h+=`<div class="slabel">${CI[c]||'📦'} ${c}</div>`;
      items.filter(i=>i.cat===c).forEach(it=>h+=planItem(it));
    });
  } else {
    const p=items.filter(i=>!i.done), d=items.filter(i=>i.done);
    if(p.length){h+=`<div class="slabel">Alınacaq — ${p.length}</div>`;p.forEach(it=>h+=shopItem(it));}
    if(d.length){h+=`<div class="slabel">Alındı — ${d.length}</div>`;d.forEach(it=>h+=shopItem(it));}
  }
  el.innerHTML=h;

  // progress
  const tot=items.length, dn=items.filter(i=>i.done).length;
  document.getElementById('dn').textContent=dn;
  document.getElementById('tn').textContent=tot;
  document.getElementById('pf').style.width=tot?(dn/tot*100)+'%':'0%';
  document.getElementById('cel').classList.toggle('show',mode==='shop'&&tot>0&&dn===tot);
}

function planItem(it){return`<div class="item"><div class="ico">${CI[it.cat]||'📦'}</div><div class="ibody"><div class="iname">${esc(it.name)}</div>${it.qty||it.note?`<div class="imeta">${[it.qty,it.note].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div>${it.qty?`<div class="iqty">${esc(it.qty)}</div>`:''}<div class="ibtns"><button class="ib e" onclick="openSheet(${it.id})">✏️</button><button class="ib" onclick="del(${it.id})">🗑️</button></div></div>`;}

function shopItem(it){return`<div class="item tap${it.done?' done':''}" onclick="toggle(${it.id})"><div class="cb">${it.done?'✓':''}</div><div class="ico">${CI[it.cat]||'📦'}</div><div class="ibody"><div class="iname">${esc(it.name)}</div>${it.qty||it.note?`<div class="imeta">${[it.qty,it.note].filter(Boolean).map(esc).join(' · ')}</div>`:''}</div>${it.qty?`<div class="iqty">${esc(it.qty)}</div>`:''}</div>`;}

function toggle(id){const it=items.find(i=>i.id===id);if(it){it.done=!it.done;persist();render();}}
function del(id){items=items.filter(i=>i.id!==id);persist();render();}
function resetDone(){items.forEach(i=>i.done=false);persist();render();}
function clearDone(){items=items.filter(i=>!i.done);persist();render();}
function clearAll(){if(!confirm('Siyahı silsinmi?'))return;items=[];persist();render();}

function openSheet(id=null){
  eid=id;const it=id?items.find(i=>i.id===id):null;
  document.getElementById('stitle').textContent=id?'✏️ Düzəlt':'➕ Yeni məhsul';
  document.getElementById('sbtn').textContent=id?'Yadda saxla':'Əlavə et';
  document.getElementById('fN').value=it?.name||'';
  document.getElementById('fQ').value=it?.qty||'';
  document.getElementById('fX').value=it?.note||'';
  document.getElementById('fC').value=it?.cat||'Tərəvəz & Meyvə';
  document.getElementById('ov').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(()=>document.getElementById('fN').focus(),320);
}
function closeSheet(){document.getElementById('ov').classList.remove('show');document.getElementById('sheet').classList.remove('show');eid=null;}

function save(){
  const name=document.getElementById('fN').value.trim();
  if(!name){document.getElementById('fN').focus();return;}
  const qty=document.getElementById('fQ').value.trim();
  const note=document.getElementById('fX').value.trim();
  const cat=document.getElementById('fC').value;
  if(eid){const it=items.find(i=>i.id===eid);if(it){it.name=name;it.qty=qty;it.note=note;it.cat=cat;}}
  else items.push({id:nid++,name,cat,qty,note,done:false});
  persist();closeSheet();render();
}

document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

// PWA — inline service worker
if('serviceWorker' in navigator){
  const sw=`const C='mkt-v1';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.add('/')).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
}

load();setMode(mode);
</script>
</body>
</html>
