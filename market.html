<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Market">
<title>Market</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overscroll-behavior:none;background:#0d0d0d}
:root{
  --bg:#0d0d0d;--s1:#171717;--s2:#1e1e1e;--s3:#252525;
  --b1:#2b2b2b;--b2:#353535;
  --accent:#f5a623;--green:#3dba78;--red:#e05535;--blue:#5b9cf6;
  --txt:#eeeeee;--t2:#7a7a7a;--t3:#383838;
  --r:13px;
  --sbot:env(safe-area-inset-bottom,0px);
  --stop:env(safe-area-inset-top,0px);
}
body{color:var(--txt);font-family:'DM Sans','Segoe UI',Arial,sans-serif;max-width:480px;margin:0 auto;
     display:flex;flex-direction:column;min-height:100vh;-webkit-font-smoothing:antialiased}

/* TOP */
.top{position:sticky;top:0;z-index:60;background:rgba(13,13,13,.97);
     backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
     border-bottom:1px solid var(--b1);
     padding:calc(9px + var(--stop)) 14px 8px;
     display:flex;align-items:center;justify-content:space-between;gap:8px}
.logo{font-size:.92rem;font-weight:700;color:var(--accent);letter-spacing:-.01em;white-space:nowrap}
.tabs{display:flex;background:var(--s2);border:1px solid var(--b1);border-radius:99px;padding:3px;gap:2px}
.tab{border:none;background:none;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.67rem;font-weight:600;
     color:var(--t2);padding:5px 9px;border-radius:99px;cursor:pointer;transition:all .18s;
     white-space:nowrap;touch-action:manipulation}
.tab.on{background:var(--accent);color:#111}
.tab:not(.on):active{background:var(--s3);color:var(--txt)}

/* PROGRESS */
.prog{padding:8px 14px 0;display:none}.prog.show{display:block}
.prow{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.pcnt{font-size:.69rem;color:var(--t2)}.pcnt b{color:var(--txt);font-weight:600}
.tpill{font-size:.69rem;font-weight:700;color:var(--green);
       background:rgba(61,186,120,.12);border:1px solid rgba(61,186,120,.25);
       padding:2px 10px;border-radius:99px}
.pbar{height:3px;background:var(--s3);border-radius:99px;overflow:hidden}
.pbf{height:100%;background:linear-gradient(90deg,var(--accent),var(--red));
     border-radius:99px;transition:width .35s ease;width:0%}

/* MAIN SCROLL */
.main{flex:1;overflow-y:auto;padding:10px 14px 112px;-webkit-overflow-scrolling:touch}

/* SECTION HEADER */
.sec{font-size:.62rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
     color:var(--t3);display:flex;align-items:center;gap:7px;margin:14px 0 6px}
.sec::after{content:'';flex:1;height:1px;background:var(--b1)}
.sec:first-child{margin-top:2px}
.scc{font-size:.61rem;font-weight:600;color:var(--t2);background:var(--s2);
     border:1px solid var(--b1);padding:1px 6px;border-radius:4px;letter-spacing:0;text-transform:none}

/* LIST ITEM */
.item{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:var(--r);
      margin-bottom:4px;transition:background .1s,opacity .15s;user-select:none;
      animation:fadein .14s ease both;touch-action:manipulation}
@keyframes fadein{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.item.tap:active{background:var(--s2)}
.item.done{opacity:.28}
.cb{width:21px;height:21px;flex-shrink:0;border-radius:6px;border:1.5px solid var(--b2);
    display:flex;align-items:center;justify-content:center;font-size:.65rem;color:#111;
    transition:all .15s;cursor:pointer;touch-action:manipulation}
.item.done .cb{background:var(--green);border-color:var(--green)}
.ico{font-size:.88rem;width:20px;text-align:center;flex-shrink:0;line-height:1}
.ibody{flex:1;min-width:0}
.iname{font-size:.87rem;font-weight:500;white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis;transition:color .13s}
.item.done .iname{color:var(--t3);text-decoration:line-through;text-decoration-color:var(--t3)}
.imeta{font-size:.67rem;color:var(--t2);margin-top:1px;white-space:nowrap;
       overflow:hidden;text-overflow:ellipsis}
.qbadge{font-size:.64rem;color:var(--accent);font-weight:700;flex-shrink:0;
        background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.18);
        padding:2px 7px;border-radius:5px}
.ibtns{display:flex;gap:1px;flex-shrink:0}
.ib{background:none;border:none;font-size:.8rem;cursor:pointer;padding:6px 7px;
    border-radius:7px;color:var(--t3);touch-action:manipulation}
.ib:active{background:var(--s2);color:var(--txt)}
.ib.e:active{color:var(--accent)}.ib.d:active{color:var(--red)}

/* PRICE INPUT (shop mode) */
.px{display:flex;align-items:center;gap:2px;flex-shrink:0}
.pxi{width:70px;background:var(--s2);border:1.5px solid var(--b1);border-radius:7px;
     padding:5px 7px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.78rem;color:var(--txt);
     text-align:right;outline:none;transition:border-color .13s;-moz-appearance:textfield}
.pxi::-webkit-outer-spin-button,.pxi::-webkit-inner-spin-button{-webkit-appearance:none}
.pxi:focus{border-color:var(--accent)}.pxi.ok{border-color:rgba(61,186,120,.5);color:var(--green)}
.pxs{font-size:.7rem;color:var(--t2);font-weight:700}

/* EMPTY / CELEBRATE */
.empty{text-align:center;padding:54px 0;color:var(--t2);font-size:.83rem;line-height:1.9}
.empty .eico{font-size:2.4rem;margin-bottom:12px}
.cel{text-align:center;padding:18px;color:var(--green);font-weight:700;
     font-size:.9rem;display:none;animation:fadein .3s ease}.cel.show{display:block}

/* FAB */
.fab{position:fixed;bottom:calc(68px + var(--sbot));width:48px;height:48px;
     background:linear-gradient(135deg,var(--accent),var(--red));border-radius:50%;
     border:none;font-size:1.3rem;color:#111;display:flex;align-items:center;
     justify-content:center;cursor:pointer;
     box-shadow:0 4px 20px rgba(245,166,35,.28);
     transition:transform .12s,box-shadow .12s;z-index:100;touch-action:manipulation;
     right:max(16px,calc(50vw - 224px))}
.fab:active{transform:scale(.9)}
.fab.hide{display:none}

/* BOTTOM BAR */
.bbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);
      width:100%;max-width:480px;background:rgba(13,13,13,.97);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-top:1px solid var(--b1);
      padding:8px 14px calc(8px + var(--sbot));z-index:90}
.brow{display:flex;gap:6px}
.bbt{flex:1;min-width:0;background:var(--s2);border:1.5px solid var(--b1);
     border-radius:9px;padding:9px 4px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;
     font-size:.69rem;font-weight:600;color:var(--t2);cursor:pointer;
     text-align:center;white-space:nowrap;touch-action:manipulation}
.bbt:active{opacity:.6}
.bbt.ra:active{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.07)}
.bbt.rr:active{border-color:var(--red);color:var(--red);background:rgba(224,85,53,.07)}
.bbt.gr{border-color:rgba(61,186,120,.35);color:var(--green)}
.bbt.gr:active{border-color:var(--green);background:rgba(61,186,120,.08)}
.bbt.bl:active{border-color:var(--blue);color:var(--blue);background:rgba(91,156,246,.07)}

/* ══ CALENDAR / ARCHIVE ══ */

/* Month stats bar */
.mbar{background:var(--s1);border:1.5px solid var(--b1);border-radius:var(--r);
      padding:11px 13px;margin-bottom:10px;display:flex;align-items:flex-start;
      justify-content:space-between;gap:12px}
.mbar-l .mnum{font-size:1.22rem;font-weight:700;color:var(--green);letter-spacing:-.01em}
.mbar-l .msub{font-size:.67rem;color:var(--t2);margin-top:3px}
.mbar-r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
/* budget row */
.bdg-row{display:flex;align-items:center;gap:6px}
.bdg-lbl{font-size:.67rem;color:var(--t2)}
.bdg-inp{width:66px;background:var(--s2);border:1.5px solid var(--b1);border-radius:7px;
         padding:4px 8px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.79rem;color:var(--txt);
         outline:none;text-align:right;-moz-appearance:textfield}
.bdg-inp::-webkit-outer-spin-button,.bdg-inp::-webkit-inner-spin-button{-webkit-appearance:none}
.bdg-inp:focus{border-color:var(--accent)}

/* budget bar */
.bdg-track{width:110px}
.bdg-bar{height:4px;background:var(--s3);border-radius:99px;overflow:hidden}
.bdg-fill{height:100%;border-radius:99px;transition:width .4s ease}
.bdg-fill.ok{background:var(--green)}.bdg-fill.warn{background:var(--accent)}.bdg-fill.over{background:var(--red)}
.bdg-info{display:flex;justify-content:space-between;margin-top:4px;font-size:.62rem;font-weight:600}

/* Calendar nav */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-title{font-size:.96rem;font-weight:700;color:var(--txt)}
.cal-btn{background:var(--s2);border:1.5px solid var(--b1);border-radius:9px;
         width:36px;height:36px;font-size:1rem;color:var(--t2);cursor:pointer;
         display:flex;align-items:center;justify-content:center;touch-action:manipulation}
.cal-btn:active{background:var(--s3);color:var(--txt)}

/* Weekday header */
.wrow{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:3px}
.wday{text-align:center;font-size:.59rem;font-weight:700;color:var(--t3);padding:3px 0}
.wday.we{color:rgba(224,85,53,.45)}

/* Day grid */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;
     padding:7px 0 5px;border-radius:9px;cursor:pointer;touch-action:manipulation;
     transition:background .1s;min-height:44px;position:relative}
.day.oth{cursor:default;pointer-events:none}
.day.oth .dn{color:var(--t3)}
.day:not(.oth):not(.sel):active{background:var(--s2)}
/* weekend cols: Sat=6th, Sun=7th (1-indexed in 7-col grid) */
.day:nth-child(7n+6) .dn,
.day:nth-child(7n)   .dn{color:rgba(238,238,238,.42)}
.dn{font-size:.86rem;font-weight:500;color:var(--txt);line-height:1}
.day.today .dn{color:var(--accent);font-weight:700}
.day.today::after{content:'';position:absolute;bottom:5px;width:4px;height:4px;
                   border-radius:50%;background:var(--accent);opacity:.5}
.day.sel{background:var(--accent) !important}
.day.sel .dn{color:#111 !important;font-weight:700}
.day.sel .dd{background:#111 !important;opacity:.65}
.day.sel::after{display:none}
/* purchase dot */
.dd{width:5px;height:5px;border-radius:50%;background:var(--green);margin-top:3px}

/* Selected day detail panel */
.detail{background:var(--s1);border:1.5px solid var(--b1);border-radius:var(--r);
        overflow:hidden;animation:fadein .18s ease both}
.detail-hd{display:flex;align-items:center;justify-content:space-between;
           padding:12px 13px;border-bottom:1px solid var(--b1)}
.dh-date{font-size:.84rem;font-weight:700}
.dh-total{font-size:.84rem;font-weight:700;color:var(--green)}
.dh-empty{text-align:center;padding:22px 0;color:var(--t2);font-size:.79rem}

/* Session (receipt) inside detail */
.sess{border-bottom:1px solid var(--b1)}.sess:last-child{border:none}
.sess-hd{display:flex;align-items:center;gap:8px;padding:11px 13px;
         cursor:pointer;touch-action:manipulation}
.sess-hd:active{background:var(--s2)}
.sess-time{font-size:.76rem;font-weight:600;color:var(--t2);flex-shrink:0}
.sess-cnt{flex:1;font-size:.74rem;color:var(--t2)}
.sess-sum{font-size:.82rem;font-weight:700;color:var(--green);flex-shrink:0}
.sess-chev{font-size:.62rem;color:var(--t3);transition:transform .18s;flex-shrink:0}
.sess.open .sess-chev{transform:rotate(180deg)}
.sess-body{display:none;padding:0 13px 10px}
.sess.open .sess-body{display:block}

/* Receipt item row */
.ri{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--b1)}
.ri:last-of-type{border:none;padding-bottom:0}
.ri-ico{font-size:.78rem;width:16px;text-align:center;flex-shrink:0}
.ri-name{flex:1;font-size:.78rem;color:var(--t2);min-width:0;
         overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ri-qty{font-size:.64rem;color:var(--t3);flex-shrink:0}
.ri-price{font-size:.75rem;font-weight:600;color:var(--green);flex-shrink:0}
.ri-add{background:none;border:none;font-size:.82rem;cursor:pointer;
        color:var(--t3);padding:3px 5px;border-radius:5px;touch-action:manipulation}
.ri-add:active{color:var(--accent);background:rgba(245,166,35,.1)}

/* Session footer */
.sess-foot{display:flex;gap:6px;padding-top:8px;
           border-top:1px solid var(--b1);margin-top:4px}
.rfb{background:var(--s2);border:1.5px solid var(--b1);border-radius:7px;
     padding:7px 10px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.69rem;
     font-weight:600;color:var(--t2);cursor:pointer;touch-action:manipulation;
     display:flex;align-items:center;gap:4px}
.rfb:active{opacity:.65}
.rfb.add{flex:1;justify-content:center}
.rfb.add:active{border-color:var(--accent);color:var(--accent);background:rgba(245,166,35,.07)}
.rfb.del:active{border-color:var(--red);color:var(--red);background:rgba(224,85,53,.07)}

/* Empty states */
.no-arch{text-align:center;padding:36px 0;color:var(--t2);font-size:.82rem;line-height:2}
.no-arch .ni{font-size:2rem;margin-bottom:8px}
.arch-hint{text-align:center;padding:20px 0;color:var(--t2);font-size:.8rem;line-height:1.9}
.arch-hint .ai{font-size:1.8rem;margin-bottom:6px}

/* TOAST */
#sv{position:fixed;bottom:106px;left:50%;transform:translateX(-50%);
    font-size:.73rem;font-weight:600;padding:6px 15px;border-radius:99px;
    opacity:0;transition:opacity .25s;z-index:999;pointer-events:none;white-space:nowrap;
    background:var(--s2);border:1px solid var(--green);color:var(--green)}

/* OVERLAY + SHEET */
.ov,.cov{position:fixed;inset:0;background:rgba(0,0,0,.72);
         opacity:0;pointer-events:none;transition:opacity .2s}
.ov{z-index:200}.cov{z-index:450}
.ov.show,.cov.show{opacity:1;pointer-events:all}

.sheet,.csheet{position:fixed;bottom:0;left:50%;
               transform:translateX(-50%) translateY(100%);
               width:100%;max-width:480px;background:var(--s1);
               border-top:1.5px solid var(--b1);border-radius:18px 18px 0 0;
               padding:13px 16px calc(22px + var(--sbot));
               transition:transform .26s cubic-bezier(.4,0,.2,1);overflow-y:auto}
.sheet{z-index:300;max-height:92vh}.csheet{z-index:500;max-height:60vh}
.sheet.show,.csheet.show{transform:translateX(-50%) translateY(0)}
.handle{width:32px;height:3px;background:var(--b1);border-radius:99px;margin:0 auto 14px}
.stitle{font-size:.95rem;font-weight:700;color:var(--accent);margin-bottom:14px}
.fl{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    color:var(--t2);margin:11px 0 5px}.fl:first-of-type{margin-top:0}
.inp{width:100%;background:var(--s2);border:1.5px solid var(--b1);border-radius:9px;
     padding:10px 12px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.88rem;color:var(--txt);
     outline:none;transition:border-color .13s}
.inp::placeholder{color:var(--t3)}.inp:focus{border-color:var(--accent)}
.irow{display:flex;gap:7px}.irow .inp{flex:1}
.sel{width:100%;background:var(--s2);border:1.5px solid var(--b1);border-radius:9px;
     padding:10px 12px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;font-size:.84rem;color:var(--txt);
     outline:none;cursor:pointer;-webkit-appearance:none;-moz-appearance:none;appearance:none}
.sel:focus{border-color:var(--accent)}.sel option{background:#1a1a1a}
.brow-s{display:flex;gap:8px;margin-top:16px}
.btn{flex:1;border:none;border-radius:9px;padding:11px;font-family:'DM Sans','Segoe UI',Arial,sans-serif;
     font-size:.85rem;font-weight:600;cursor:pointer;touch-action:manipulation}
.btn:active{opacity:.8}
.btn-p{background:linear-gradient(135deg,var(--accent),var(--red));color:#111}
.btn-n{background:var(--s2);border:1.5px solid var(--b1);color:var(--t2)}
.btn-r{background:rgba(224,85,53,.14);border:1.5px solid rgba(224,85,53,.28);color:var(--red)}
.cmsg{font-size:.9rem;color:var(--txt);font-weight:600;margin-bottom:6px;line-height:1.5}
.csub{font-size:.77rem;color:var(--t2);margin-bottom:16px;line-height:1.6;white-space:pre-line;display:none}
</style>
</head>
<body>

<div class="top">
  <div class="logo">🛒 Market</div>
  <div class="tabs">
    <button class="tab" id="tPlan" onclick="setMode('plan')">📋 Siyahı</button>
    <button class="tab" id="tShop" onclick="setMode('shop')">🏪 Alış</button>
    <button class="tab" id="tArch" onclick="setMode('arch')">📅 Arxiv</button>
  </div>
</div>

<div class="prog" id="prog">
  <div class="prow">
    <span class="pcnt"><b id="pdone">0</b> / <span id="ptot">0</span> alındı</span>
    <div class="tpill" id="tpill">0.00 ₼</div>
  </div>
  <div class="pbar"><div class="pbf" id="pbf"></div></div>
</div>

<div class="main" id="main"></div>

<button class="fab" id="fab" onclick="openSheet()">＋</button>
<div class="bbar"><div class="brow" id="brow"></div></div>
<div id="sv"></div>

<!-- Add/edit sheet -->
<div class="ov"  id="ov"  onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="handle"></div>
  <div class="stitle" id="stitle">➕ Yeni məhsul</div>
  <div class="fl">Ad *</div>
  <input class="inp" id="fN" placeholder="məs. Süd, Çörək, Pomidor..." maxlength="50"
         onkeydown="if(event.key==='Enter')save()">
  <div class="fl">Miqdar</div>
  <div class="irow">
    <input class="inp" id="fQ" placeholder="1 kq, 3 ədəd..." maxlength="20"
           onkeydown="if(event.key==='Enter')save()">
    <input class="inp" id="fX" placeholder="Qeyd (istəyə bağlı)" maxlength="40"
           onkeydown="if(event.key==='Enter')save()">
  </div>
  <div class="fl">Kateqoriya</div>
  <select class="sel" id="fC"></select>
  <div class="brow-s">
    <button class="btn btn-n" onclick="closeSheet()">Ləğv et</button>
    <button class="btn btn-p" id="sbtn" onclick="save()">Əlavə et</button>
  </div>
</div>

<!-- Confirm sheet -->
<div class="cov" id="cov" onclick="closeCSheet()"></div>
<div class="csheet" id="csheet">
  <div class="handle"></div>
  <div class="cmsg" id="cmsg"></div>
  <div class="csub" id="csub"></div>
  <div class="brow-s">
    <button class="btn btn-n" onclick="closeCSheet()">Ləğv et</button>
    <button class="btn" id="cyes" onclick="confirmYes()">Bəli</button>
  </div>
</div>

<script>
/* ═══════════════════════════════
   CONSTANTS
═══════════════════════════════ */
const KEY = 'mkt5';

// Categories — order matters (plan view sort order)
const CATS = {
  'Tərəvəz & Meyvə' : '🥬',
  'Ət & Balıq'       : '🥩',
  'Toyuq'            : '🍗',
  'Yumurta'          : '🥚',
  'Süd & Kefir'      : '🥛',
  'Pendir'           : '🧀',
  'Qaymaq & Smetan'  : '🥣',   // ← YENİ
  'Yağ & Margarin'   : '🧈',   // ← YENİ
  'Çörək & Unlu'     : '🍞',
  'Ərzaq'            : '🌾',
  'Ədviyyat'         : '🧂',
  'Sous & Mayonez'   : '🫙',   // ← YENİ  (ketchup, mayonez, sous)
  'Konserv'          : '🥫',
  'Şirniyyat'        : '🍬',
  'İçki'             : '🧃',
  'Dondurulmuş'      : '🧊',
  'Ev & Təmizlik'    : '🧹',
  'Şəxsi qulluq'     : '🧴',
  'Dərman & Vitamin' : '💊',
  'Uşaq məhsulları'  : '👶',
  'Heyvan yeməyi'    : '🐾',
  'Digər'            : '📦',
};

// Mon-first short weekday labels (getDay(): 0=Sun)
const WLBL  = ['B.e','Ç.a','Çər','C.a','Cüm','Şnb','Baz'];
const WFULL = ['Bazar ertəsi','Çərşənbə axş.','Çərşənbə','Cümə axş.','Cümə','Şənbə','Bazar'];
const MON   = ['Yanvar','Fevral','Mart','Aprel','May','İyun',
               'İyul','Avqust','Sentyabr','Oktyabr','Noyabr','Dekabr'];

/* ═══════════════════════════════
   STATE
═══════════════════════════════ */
let items   = [];   // current shopping list
let hist    = [];   // [{id, date, items:[...], total}]
let budgets = {};   // { 'YYYY-MM': number }  — per-month budgets
let nid     = 1;
let mode    = 'plan';
let eid     = null; // item being edited
let _cb     = null; // confirm callback

// Calendar state — persisted
let calY = new Date().getFullYear();
let calM = new Date().getMonth();
let calSel = null; // 'YYYY-MM-DD' or null

/* ═══════════════════════════════
   STORAGE
═══════════════════════════════ */
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw);
      items   = Array.isArray(d.items)   ? d.items   : [];
      hist    = Array.isArray(d.hist)    ? d.hist    : [];
      budgets = (d.budgets && typeof d.budgets === 'object') ? d.budgets : {};
      nid     = (d.nid >= 1) ? d.nid : 1;
      mode    = ['plan','shop','arch'].includes(d.mode) ? d.mode : 'plan';
      // calendar state
      if (Number.isInteger(d.calY) && d.calY >= 2020) calY = d.calY;
      if (Number.isInteger(d.calM) && d.calM >= 0 && d.calM <= 11) calM = d.calM;
      calSel  = typeof d.calSel === 'string' ? d.calSel : null;
      // migrate: ensure price field exists on all items
      items.forEach(i => { if (!('price' in i)) i.price = null; });
      return;
    }
  } catch(e) {}
  // First-run defaults
  items = [
    mk_item('Toyuq filei',   'Toyuq',           '1 kq'),
    mk_item('Bulgur',        'Ərzaq',            '500 q'),
    mk_item('Pomidor',       'Tərəvəz & Meyvə',  '1 kq'),
    mk_item('Bibər',         'Tərəvəz & Meyvə',  '3 ədəd'),
    mk_item('Yumurta',       'Yumurta',          '10 ədəd'),
    mk_item('Süd',           'Süd & Kefir',      '1 L'),
    mk_item('Smetan',        'Qaymaq & Smetan',  '300 q'),
    mk_item('Çörək',         'Çörək & Unlu',     ''),
    mk_item('Mayonez',       'Sous & Mayonez',   ''),
    mk_item('Çöp poşeti',    'Ev & Təmizlik',    ''),
  ];
}
function mk_item(name, cat, qty) {
  return { id: nid++, name, cat, qty, note: '', done: false, price: null };
}

function persist(showToast) {
  try {
    localStorage.setItem(KEY, JSON.stringify(
      { items, hist, budgets, nid, mode, calY, calM, calSel }
    ));
  } catch(e) {}
  if (showToast) toast(showToast[0], showToast[1]);
}

/* ═══════════════════════════════
   HELPERS
═══════════════════════════════ */
function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function fmt(n)  { return Number(n || 0).toFixed(2); }
function p2(n)   { return String(n).padStart(2, '0'); }
function ci(cat) { return CATS[cat] || '📦'; }

// 'YYYY-MM-DD' from ISO string (local time)
function toDateStr(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
}
// 'YYYY-MM' from ISO string
function toMonthKey(iso) {
  const d = new Date(iso);
  return `${d.getFullYear()}-${p2(d.getMonth()+1)}`;
}
// Mon-first weekday index: Mon=0 … Sun=6
function mfwd(d) { return (d.getDay() + 6) % 7; }

function fmtTime(iso) {
  const d = new Date(iso);
  return `${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
// 'YYYY-MM-DD' → 'Cümə, 10 Aprel 2026'
function fmtDayFull(ds) {
  const [y,m,d_] = ds.split('-').map(Number);
  const d = new Date(y, m-1, d_, 12);
  return `${WFULL[mfwd(d)]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`;
}
// 'YYYY-MM-DD' → calendar month key
function dsToMk(ds) { return ds.slice(0, 7); }

function toast(msg, color) {
  const t = document.getElementById('sv');
  t.textContent = msg;
  t.style.borderColor = color || '#3dba78';
  t.style.color       = color || '#3dba78';
  t.style.border      = `1px solid ${color || '#3dba78'}`;
  t.style.opacity     = '1';
  clearTimeout(window._st);
  window._st = setTimeout(() => t.style.opacity = '0', 2100);
}

/* ═══════════════════════════════
   CONFIRM SHEET
═══════════════════════════════ */
function ask(msg, sub, yesLbl, yesClass, cb) {
  _cb = cb;
  document.getElementById('cmsg').textContent = msg || '';
  const cs = document.getElementById('csub');
  cs.textContent  = sub || '';
  cs.style.display = sub ? 'block' : 'none';
  const btn = document.getElementById('cyes');
  btn.textContent = yesLbl || 'Bəli';
  btn.className   = 'btn ' + (yesClass || 'btn-r');
  document.getElementById('cov').classList.add('show');
  document.getElementById('csheet').classList.add('show');
}
function closeCSheet() {
  document.getElementById('cov').classList.remove('show');
  document.getElementById('csheet').classList.remove('show');
  _cb = null;
}
function confirmYes() { const cb = _cb; closeCSheet(); if (cb) cb(); }

/* ═══════════════════════════════
   CATEGORY SELECT
═══════════════════════════════ */
function buildCatSel(val) {
  document.getElementById('fC').innerHTML = Object.entries(CATS)
    .map(([k,v]) => `<option value="${esc(k)}"${k===val?' selected':''}>${v} ${esc(k)}</option>`)
    .join('');
}

/* ═══════════════════════════════
   MODE SWITCHING
═══════════════════════════════ */
function setMode(m) {
  mode = m;
  document.getElementById('tPlan').classList.toggle('on', m === 'plan');
  document.getElementById('tShop').classList.toggle('on', m === 'shop');
  document.getElementById('tArch').classList.toggle('on', m === 'arch');
  document.getElementById('fab') .classList.toggle('hide', m !== 'plan');
  document.getElementById('prog').classList.toggle('show', m === 'shop');
  persist(null);
  render();
}
function render() {
  if (mode === 'arch') { renderArch(); return; }
  renderList();
}

/* ═══════════════════════════════
   LIST (plan + shop)
═══════════════════════════════ */
function renderList() {
  const el = document.getElementById('main');

  document.getElementById('brow').innerHTML = mode === 'plan'
    ? `<button class="bbt rr" onclick="askClearAll()">🗑️ Siyahını sil</button>`
    : `<button class="bbt ra" onclick="resetDone()">🔄 Sıfırla</button>
       <button class="bbt rr" onclick="askClearDone()">🗑️ Alınanları sil</button>
       <button class="bbt gr" onclick="askComplete()">✅ Tamamla & Saxla</button>`;

  if (!items.length) {
    el.innerHTML = '<div class="empty"><div class="eico">🧺</div>Siyahı boşdur.<br>＋ düyməsi ilə məhsul əlavə edin.</div>';
    return;
  }

  let h = '';
  if (mode === 'plan') {
    const catOrder = Object.keys(CATS);
    const usedCats = [...new Set(items.map(i => i.cat))]
      .sort((a,b) => catOrder.indexOf(a) - catOrder.indexOf(b));
    usedCats.forEach(cat => {
      const its = items.filter(i => i.cat === cat);
      h += `<div class="sec">${ci(cat)} ${esc(cat)} <span class="scc">${its.length}</span></div>`;
      its.forEach(it => h += planItem(it));
    });
  } else {
    const pend = items.filter(i => !i.done);
    const done = items.filter(i =>  i.done);
    if (pend.length) {
      h += `<div class="sec">Alınacaq — ${pend.length}</div>`;
      pend.forEach(it => h += shopItem(it));
    }
    if (done.length) {
      h += `<div class="sec">Alındı — ${done.length}</div>`;
      done.forEach(it => h += shopItem(it));
    }
    if (items.length && items.every(i => i.done))
      h += `<div class="cel show">🎉 Hamısı alındı! Toplam: <b>${fmt(doneTotal())} ₼</b></div>`;
  }

  el.innerHTML = h;
  updProg();
}

function updProg() {
  const tot = items.length;
  const dn  = items.filter(i => i.done).length;
  document.getElementById('pdone').textContent = dn;
  document.getElementById('ptot') .textContent = tot;
  document.getElementById('pbf')  .style.width = tot ? (dn/tot*100)+'%' : '0%';
  document.getElementById('tpill').textContent = fmt(doneTotal()) + ' ₼';
}
function doneTotal() {
  return items.filter(i => i.done).reduce((s,i) => s + (i.price||0), 0);
}

function planItem(it) {
  return `<div class="item">
    <div class="ico">${ci(it.cat)}</div>
    <div class="ibody">
      <div class="iname">${esc(it.name)}</div>
      ${it.qty||it.note ? `<div class="imeta">${[it.qty,it.note].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
    </div>
    ${it.qty ? `<div class="qbadge">${esc(it.qty)}</div>` : ''}
    <div class="ibtns">
      <button class="ib e" onclick="openSheet(${it.id})">✏️</button>
      <button class="ib d" onclick="askDel(${it.id})">🗑</button>
    </div>
  </div>`;
}

function shopItem(it) {
  const pv = it.price != null ? it.price : '';
  const pc = (it.price && it.price > 0) ? ' ok' : '';
  return `<div class="item tap${it.done ? ' done' : ''}">
    <div class="cb" onclick="toggle(${it.id})">${it.done ? '✓' : ''}</div>
    <div class="ico">${ci(it.cat)}</div>
    <div class="ibody" onclick="toggle(${it.id})" style="cursor:pointer">
      <div class="iname">${esc(it.name)}</div>
      ${it.qty||it.note ? `<div class="imeta">${[it.qty,it.note].filter(Boolean).map(esc).join(' · ')}</div>` : ''}
    </div>
    <div class="px">
      <input class="pxi${pc}" type="number" min="0" step="0.01"
             placeholder="0.00" value="${esc(String(pv))}"
             onclick="event.stopPropagation()"
             oninput="setPrice(${it.id}, this)"
             onfocus="this.select(); event.stopPropagation()">
      <span class="pxs">₼</span>
    </div>
  </div>`;
}

/* ═══════════════════════════════
   LIST ACTIONS
═══════════════════════════════ */
function toggle(id) {
  const it = items.find(i => i.id === id);
  if (it) { it.done = !it.done; persist(null); renderList(); }
}
function setPrice(id, inp) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  const raw = inp.value.trim(), v = parseFloat(raw);
  it.price = (raw === '' || isNaN(v)) ? null : Math.max(0, v);
  inp.classList.toggle('ok', !!it.price && it.price > 0);
  updProg();
  persist(null);
}
function askDel(id) {
  const it = items.find(i => i.id === id);
  ask(`"${it?.name}" silinsin?`, '', 'Sil', 'btn-r', () => {
    items = items.filter(i => i.id !== id);
    persist(['🗑️ Silindi', '#e05535']);
    renderList();
  });
}
function askClearAll() {
  if (!items.length) return;
  ask('Bütün siyahı silinsin?', 'Bu əməliyyat geri alına bilməz.', 'Hamısını sil', 'btn-r', () => {
    items = [];
    persist(['🗑️ Siyahı silindi', '#e05535']);
    renderList();
  });
}
function askClearDone() {
  const n = items.filter(i => i.done).length;
  if (!n) { toast('⚠️ Heç bir məhsul işarələnməyib', '#f5a623'); return; }
  ask(`${n} işarəli məhsul silinsin?`, '', 'Sil', 'btn-r', () => {
    items = items.filter(i => !i.done);
    persist(null);
    renderList();
  });
}
function resetDone() { items.forEach(i => i.done = false); persist(null); renderList(); }

function askComplete() {
  const done = items.filter(i => i.done);
  if (!done.length) { toast('⚠️ Heç bir məhsul işarələnməyib', '#f5a623'); return; }
  const total = done.reduce((s,i) => s + (i.price||0), 0);
  const noP   = done.filter(i => !i.price || i.price <= 0).length;
  const sub   = (noP ? `${noP} məhsulun qiyməti daxil edilməyib.\n` : '')
              + 'Alış bu gün üçün arxivə əlavə edilsin?';
  ask(`${done.length} məhsul · Toplam: ${fmt(total)} ₼`, sub, '✅ Tamamla', 'btn-p', () => {
    hist.unshift({
      id   : Date.now(),
      date : new Date().toISOString(),
      items: done.map(i => ({...i})),
      total,
    });
    items = items.filter(i => !i.done);
    persist(['🎉 Alış arxivə əlavə edildi!', '#3dba78']);
    renderList();
  });
}

/* ═══════════════════════════════
   ADD / EDIT SHEET
═══════════════════════════════ */
function openSheet(id = null) {
  eid = id;
  const it = id ? items.find(i => i.id === id) : null;
  document.getElementById('stitle').textContent = id ? '✏️ Düzəlt' : '➕ Yeni məhsul';
  document.getElementById('sbtn') .textContent  = id ? 'Yadda saxla' : 'Əlavə et';
  document.getElementById('fN').value = it?.name || '';
  document.getElementById('fQ').value = it?.qty  || '';
  document.getElementById('fX').value = it?.note || '';
  buildCatSel(it?.cat || 'Tərəvəz & Meyvə');
  document.getElementById('ov').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(() => document.getElementById('fN').focus(), 280);
}
function closeSheet() {
  document.getElementById('ov').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
  eid = null;
}
function save() {
  const name = document.getElementById('fN').value.trim();
  if (!name) { document.getElementById('fN').focus(); return; }
  const qty  = document.getElementById('fQ').value.trim();
  const note = document.getElementById('fX').value.trim();
  const cat  = document.getElementById('fC').value;
  if (eid) {
    const it = items.find(i => i.id === eid);
    if (it) Object.assign(it, { name, qty, note, cat });
  } else {
    items.push({ id: nid++, name, cat, qty, note, done: false, price: null });
  }
  persist(['✓ Yadda saxlandı', '#3dba78']);
  closeSheet();
  renderList();
}

/* ═══════════════════════════════
   ARCHIVE — CALENDAR
═══════════════════════════════ */
function renderArch() {
  document.getElementById('fab').classList.add('hide');
  document.getElementById('brow').innerHTML =
    `<button class="bbt gr"  onclick="saveArch()">💾 Saxla</button>
     <button class="bbt bl"  onclick="exportCSV()">📤 CSV</button>
     <button class="bbt rr"  onclick="askClearHist()">🗑️ Arxivi sil</button>`;

  const el  = document.getElementById('main');
  const now = new Date();
  const todayStr = toDateStr(now.toISOString());

  // Current displayed month's key  e.g. '2026-04'
  const mk  = `${calY}-${p2(calM+1)}`;

  // Sessions in displayed month
  const msess  = hist.filter(s => toMonthKey(s.date) === mk);
  const mtotal = msess.reduce((s,h) => s + h.total, 0);
  const mItemN = msess.reduce((s,h) => s + h.items.length, 0);

  // Budget for this month
  const mbdg = budgets[mk] || 0;
  const bp   = mbdg > 0 ? Math.min(mtotal / mbdg * 100, 100) : 0;
  const bc   = bp < 70 ? 'ok' : bp < 100 ? 'warn' : 'over';
  const bclr = bp < 70 ? 'var(--green)' : bp < 100 ? 'var(--accent)' : 'var(--red)';
  const rem  = mbdg - mtotal;

  // ── Month stats bar ──
  let h = `<div class="mbar">
    <div class="mbar-l">
      <div class="mnum">${fmt(mtotal)} ₼</div>
      <div class="msub">${msess.length} alış · ${mItemN} məhsul</div>
    </div>
    <div class="mbar-r">
      <div class="bdg-row">
        <span class="bdg-lbl">Büdcə:</span>
        <input class="bdg-inp" type="number" min="0" step="1" id="bdg-inp"
               placeholder="–" value="${mbdg || ''}" oninput="onBudgetInput(this)">
        <span class="bdg-lbl">₼</span>

      </div>
      <div class="bdg-track" id="bdg-track" style="${mbdg <= 0 ? 'display:none' : ''}">
        <div class="bdg-bar">
          <div class="bdg-fill ${bc}" id="bdg-fill" style="width:${bp.toFixed(1)}%"></div>
        </div>
        <div class="bdg-info">
          <span style="color:${bclr}">${Math.round(bp)}%</span>
          <span style="color:${rem>=0?'var(--green)':'var(--red)'}">
            ${rem >= 0 ? fmt(rem)+' ₼ qalır' : fmt(-rem)+' ₼ aşıb'}
          </span>
        </div>
      </div>
    </div>
  </div>`;

  // ── Calendar navigation ──
  h += `<div class="cal-nav">
    <button class="cal-btn" onclick="calPrev()">‹</button>
    <div class="cal-title">${MON[calM]} ${calY}</div>
    <button class="cal-btn" onclick="calNext()">›</button>
  </div>`;

  // ── Weekday header (Mon-first) ──
  h += `<div class="wrow">
    ${WLBL.map((d,i) => `<div class="wday${i >= 5 ? ' we' : ''}">${esc(d)}</div>`).join('')}
  </div>`;

  // ── Grid ──
  // offset: how many empty cells before the 1st of the month
  const firstOffset = mfwd(new Date(calY, calM, 1));
  const daysInMonth = new Date(calY, calM+1, 0).getDate();
  const daysInPrev  = new Date(calY, calM,   0).getDate();

  // Which calendar-day numbers have purchases?
  const shopDays = new Set();
  hist.forEach(s => {
    const d = new Date(s.date);
    if (d.getFullYear() === calY && d.getMonth() === calM)
      shopDays.add(d.getDate());
  });

  h += `<div class="cal-grid">`;

  // Trailing days from prev month
  for (let i = 0; i < firstOffset; i++) {
    h += `<div class="day oth"><span class="dn">${daysInPrev - firstOffset + 1 + i}</span></div>`;
  }

  // Current month days
  for (let day = 1; day <= daysInMonth; day++) {
    const ds     = `${calY}-${p2(calM+1)}-${p2(day)}`;
    const isToday = ds === todayStr;
    const isSel   = ds === calSel;
    const hasDot  = shopDays.has(day);
    h += `<div class="day${isToday?' today':''}${isSel?' sel':''}" onclick="selDay('${ds}')">
      <span class="dn">${day}</span>
      ${hasDot ? '<span class="dd"></span>' : ''}
    </div>`;
  }

  // Leading days of next month
  const filled = firstOffset + daysInMonth;
  const trail  = filled % 7 === 0 ? 0 : 7 - (filled % 7);
  for (let i = 1; i <= trail; i++) {
    h += `<div class="day oth"><span class="dn">${i}</span></div>`;
  }
  h += `</div>`; // cal-grid

  // ── Selected day detail ──
  if (calSel) {
    const daySess  = hist.filter(s => toDateStr(s.date) === calSel);
    const dayTotal = daySess.reduce((s,h) => s + h.total, 0);

    h += `<div class="detail">
      <div class="detail-hd">
        <div class="dh-date">${esc(fmtDayFull(calSel))}</div>
        ${daySess.length ? `<div class="dh-total">${fmt(dayTotal)} ₼</div>` : ''}
      </div>`;

    if (!daySess.length) {
      h += `<div class="dh-empty">Bu gün üçün alış yoxdur.</div>`;
    } else {
      daySess.forEach(s => {
        h += `<div class="sess" id="sess${s.id}">
          <div class="sess-hd" onclick="toggleSess(${s.id})">
            <span class="sess-time">${fmtTime(s.date)}</span>
            <span class="sess-cnt">${s.items.length} məhsul</span>
            <span class="sess-sum">${fmt(s.total)} ₼</span>
            <span class="sess-chev">▼</span>
          </div>
          <div class="sess-body">
            ${s.items.map(it => `<div class="ri">
              <div class="ri-ico">${ci(it.cat)}</div>
              <div class="ri-name">${esc(it.name)}</div>
              ${it.qty ? `<div class="ri-qty">${esc(it.qty)}</div>` : ''}
              <div class="ri-price">${it.price && it.price > 0 ? fmt(it.price)+' ₼' : '—'}</div>
              <button class="ri-add" title="Siyahıya əlavə et"
                      onclick="addOne(${JSON.stringify(it.name)},${JSON.stringify(it.cat)},${JSON.stringify(it.qty||'')},event)">＋</button>
            </div>`).join('')}
            <div class="sess-foot">
              <button class="rfb add" onclick="addAll(${s.id})">🔄 Hamısını siyahıya əlavə et</button>
              <button class="rfb del" onclick="askDelSess(${s.id})">🗑️</button>
            </div>
          </div>
        </div>`;
      });
      // Auto-open if single session
      if (daySess.length === 1)
        setTimeout(() => document.getElementById('sess'+daySess[0].id)?.classList.add('open'), 60);
    }
    h += `</div>`; // .detail

  } else if (!hist.length) {
    h += `<div class="no-arch"><div class="ni">📭</div>
      Hələ arxiv yoxdur.<br>
      Alış edib <b>✅ Tamamla & Saxla</b><br>düyməsini basın.
    </div>`;
  } else {
    h += `<div class="arch-hint"><div class="ai">☝️</div>
      Bir günə toxunun,<br>o günün alışlarını görün.
    </div>`;
  }

  el.innerHTML = h;
}

/* Calendar navigation — saves state immediately */
function calPrev() {
  calM--; if (calM < 0) { calM = 11; calY--; }
  calSel = null;
  persist(null);
  renderArch();
}
function calNext() {
  calM++; if (calM > 11) { calM = 0; calY++; }
  calSel = null;
  persist(null);
  renderArch();
}
function selDay(ds) {
  calSel = (calSel === ds) ? null : ds;
  persist(null);
  renderArch();
  if (calSel)
    setTimeout(() => document.querySelector('.detail')?.scrollIntoView({ behavior:'smooth', block:'nearest' }), 80);
}
function toggleSess(id) { document.getElementById('sess'+id)?.classList.toggle('open'); }

/* ── Archive item actions ── */
function addOne(name, cat, qty, evt) {
  evt.stopPropagation();
  if (items.find(i => i.name.toLowerCase() === name.toLowerCase() && !i.done)) {
    toast('⚠️ Artıq siyahıdadır', '#f5a623'); return;
  }
  items.push({ id: nid++, name, cat, qty: qty||'', note:'', done: false, price: null });
  persist(null);
  toast(`✓ "${name}" siyahıya əlavə edildi`, '#3dba78');
}
function addAll(sessId) {
  const s = hist.find(h => h.id === sessId); if (!s) return;
  let n = 0;
  s.items.forEach(it => {
    if (!items.find(i => i.name.toLowerCase() === it.name.toLowerCase() && !i.done)) {
      items.push({ id: nid++, name: it.name, cat: it.cat, qty: it.qty||'',
                   note: it.note||'', done: false, price: null });
      n++;
    }
  });
  persist(null);
  toast(n ? `✓ ${n} məhsul siyahıya əlavə edildi` : '⚠️ Hamısı artıq siyahıdadır',
        n ? '#3dba78' : '#f5a623');
}
function askDelSess(id) {
  const s = hist.find(h => h.id === id);
  const ds = s ? toDateStr(s.date) : '';
  ask(
    `Bu alış silinsin?`,
    `${esc(ds ? fmtDayFull(ds) : '')} · ${s?.items.length||0} məhsul · ${fmt(s?.total)} ₼`,
    'Sil', 'btn-r',
    () => { hist = hist.filter(h => h.id !== id); persist(['🗑️ Alış silindi','#e05535']); renderArch(); }
  );
}
function askClearHist() {
  if (!hist.length) { toast('Arxiv boşdur', '#f5a623'); return; }
  ask('Bütün arxiv silinsin?', `${hist.length} alış həmişəlik silinir.`,
    'Hamısını sil', 'btn-r',
    () => { hist = []; persist(['🗑️ Arxiv silindi','#e05535']); renderArch(); });
}

/* ── Save archive state: budget + calY/calM ── */
function saveArch() {
  const inp = document.getElementById('bdg-inp');
  const mk  = `${calY}-${p2(calM+1)}`;
  if (inp) {
    const v   = parseFloat(inp.value);
    const val = (inp.value.trim() === '' || isNaN(v)) ? 0 : Math.max(0, v);
    if (val <= 0) delete budgets[mk];
    else          budgets[mk] = val;
  }
  _bdgTmp = null;   // FIX 3: clear stale temp
  persist(['💾 Yadda saxlandı', '#3dba78']);
  renderArch();     // FIX 2: refresh so budget bar updates
}

/* ── CSV export ── */
function exportCSV() {
  if (!hist.length) { toast('⚠️ Arxiv boşdur', '#f5a623'); return; }
  const rows = [['Tarix','Gün','Saat','Məhsul','Kateqoriya','Miqdar','Qeyd',
                 'Qiymət (₼)','Alış Toplam (₼)']];
  hist.forEach(s => {
    const d = new Date(s.date);
    s.items.forEach((it, i) => {
      rows.push([
        fmtDayFull(toDateStr(s.date)),
        WFULL[mfwd(d)],
        fmtTime(s.date),
        it.name, it.cat, it.qty||'', it.note||'',
        it.price != null ? fmt(it.price) : '',
        i === 0 ? fmt(s.total) : '',
      ]);
    });
  });
  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\r\n');
  const a = Object.assign(document.createElement('a'), {
    href    : URL.createObjectURL(new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'})),
    download: 'market_' + new Date().toISOString().slice(0,10) + '.csv',
  });
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  toast('📤 CSV yükləndi', '#5b9cf6');
}

/* ═══════════════════════════════
   KEYBOARD + SW CLEANUP + INIT
═══════════════════════════════ */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (document.getElementById('csheet').classList.contains('show')) closeCSheet();
  else closeSheet();
});

if ('serviceWorker' in navigator)
  navigator.serviceWorker.getRegistrations().then(r => r.forEach(x => x.unregister()));

load();
setMode(mode);
</script>
